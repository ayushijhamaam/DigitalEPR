<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive MaxVolt ReEarth process tracker for client and internal workflow visibility.">
<meta name="theme-color" content="#10161A">
<title>MaxVolt ReEarth — Process Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10161A;
    --panel: #1A2226;
    --panel-alt: #202B2E;
    --panel-raised: #263133;
    --line: #2B3538;
    --line-soft: #212A2D;
    --text: #EAF2EF;
    --text-muted: #8FA6A0;
    --text-dim: #5E7570;
    --teal: #4FD1AE;
    --teal-dim: #2A6656;
    --copper: #D08A56;
    --amber: #E8B94E;
    --red: #E36868;
    --font-display: 'Space Grotesk', 'IBM Plex Sans', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 32px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  /* ---------- Header ---------- */
  .header{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap: wrap; gap: 18px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 6px;
  }
  .title{
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }
  .title span{ color: var(--text-muted); font-weight: 500; }

  /* ---------- View toggle ---------- */
  .toggle{
    display:inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }
  .toggle button{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.03em;
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toggle button.active{
    background: var(--teal);
    color: #0A1512;
    font-weight: 600;
  }
  .toggle button:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ---------- Cell tracker (battery-cell step indicator) ---------- */
  .tracker{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 30px;
  }
  .cell{
    position: relative;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 12px 12px;
    text-align: left;
    transition: border-color .15s ease, transform .15s ease;
  }
  .cell:hover{ border-color: var(--teal-dim); }
  .cell:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }
  .cell .num{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .05em;
  }
  .cell .label{
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.25;
  }
  .charge{
    margin-top: 10px;
    height: 5px;
    border-radius: 3px;
    background: var(--line-soft);
    overflow: hidden;
  }
  .charge i{
    display:block; height: 100%; width: 0%;
    background: var(--text-dim);
    border-radius: 3px;
    transition: width .25s ease, background .25s ease;
  }
  .cell.done .charge i{ width: 100%; background: var(--teal); }
  .cell.done .label{ color: var(--text); }
  .cell.active{ border-color: var(--teal); background: var(--panel-alt); }
  .cell.active .label{ color: var(--text); }
  .cell.active .charge i{ background: var(--amber); width: 60%; }
  .cell.done.active .charge i{ background: var(--teal); width: 100%; }

  /* ---------- Content panel ---------- */
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 26px 24px;
    min-height: 360px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  .panel-head h2{
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    margin: 0;
  }
  .tag{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-muted);
  }
  .tag.client{ color: var(--teal); border-color: var(--teal-dim); }
  .tag.internal{ color: var(--copper); border-color: #6B4A31; }

  /* Client: milestone checklist card */
  .milestones{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:10px; }
  .milestones li{
    display:flex; align-items:center; gap:10px;
    font-size: 14px; color: var(--text-muted);
    padding: 10px 12px;
    background: var(--panel-alt);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
  }
  .milestones li.check{ color: var(--text); }
  .milestones li.pending{ color: var(--text-dim); border-style: dashed; }
  .dot{ width: 9px; height:9px; border-radius:50%; flex-shrink:0; background: var(--line); }
  .milestones li.check .dot{ background: var(--teal); }
  .milestones li.pending .dot{ background: var(--text-dim); }

  .status-line{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin: 4px 0 20px;
  }
  .status-line b{ color: var(--amber); font-weight: 600; }

  .actions{ display:flex; gap:10px; flex-wrap: wrap; }
  .btn{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text);
    cursor: pointer;
  }
  .btn.primary{ background: var(--teal); color:#0A1512; border-color: var(--teal); font-weight:600; }
  .btn.ghost{ background: transparent; color: var(--text-muted); }
  .btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

  .note{
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    border-top: 1px dashed var(--line);
    padding-top: 14px;
    line-height: 1.5;
  }

  /* Internal: data table */
  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  thead th{
    text-align:left;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  tbody td{
    padding: 10px 10px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--text-muted);
  }
  tbody tr:last-child td{ border-bottom:none; }
  td.strong{ color: var(--text); font-weight:500; }
  .pill{
    display:inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .pill.ok{ color: var(--teal); border-color: var(--teal-dim); }
  .pill.warn{ color: var(--amber); border-color: #6B5A2A; }
  .pill.bad{ color: var(--red); border-color: #6B3131; }
  .pill.mid{ color: var(--text-muted); }

  /* KPI grid for internal ops view */
  .kpis{ display:grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:20px; }
  .kpi{
    background: var(--panel-alt); border:1px solid var(--line-soft); border-radius:10px;
    padding: 14px 14px 12px;
  }
  .kpi .v{ font-family: var(--font-mono); font-size: 20px; font-weight:600; color: var(--text); }
  .kpi .l{ font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .costblock{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px 24px;
    margin-bottom: 18px;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  .costblock .row{ display:flex; justify-content:space-between; border-bottom:1px dashed var(--line-soft); padding-bottom:6px; color: var(--text-muted); }
  .costblock .row b{ color: var(--text); font-weight:600; }
  .costblock .row.total b{ color: var(--copper); }

  .recommend{
    display:inline-flex; align-items:center; gap:8px;
    font-family: var(--font-mono); font-size:12px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--panel-alt); border:1px solid var(--teal-dim); color: var(--teal);
    margin-bottom: 6px;
  }

  footer{
    text-align:center; margin-top: 30px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
  }

  /* ---------- Onboarding form (Step 1 / Client) ---------- */
  .section-block{ margin-bottom: 26px; }
  .section-block:last-child{ margin-bottom: 0; }
  .section-head{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom: 12px;
  }
  .section-head .si{
    font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px;
  }
  .section-head h3{
    font-family: var(--font-display); font-size: 14.5px; font-weight:600; margin:0; color: var(--text);
  }
  .section-sub{ font-size: 12px; color: var(--text-dim); margin: -6px 0 14px; }

  .cat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .cat-card{
    background: var(--panel-alt); border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 14px 14px 12px; cursor: pointer; transition: border-color .15s ease, background .15s ease;
  }
  .cat-card:hover{ border-color: var(--teal-dim); }
  .cat-card.picked{ border-color: var(--teal); background: var(--panel-raised); }
  .cat-card .cat-tag{
    font-family: var(--font-mono); font-size: 10px; letter-spacing:.05em; color: var(--teal);
    display:block; margin-bottom: 6px;
  }
  .cat-card.picked .cat-tag{ color: var(--teal); }
  .cat-card h4{ font-family: var(--font-display); font-size: 13.5px; margin: 0 0 8px; color: var(--text); }
  .cat-card ul{ margin:0; padding-left: 16px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }

  .form-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 12px 16px; }
  .field{ display:flex; flex-direction:column; gap: 6px; }
  .field.full{ grid-column: 1 / -1; }
  .field label{ font-family: var(--font-mono); font-size: 10.5px; letter-spacing:.04em; text-transform:uppercase; color: var(--text-dim); }
  .field input, .field select, .field textarea{
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 11px; font-family: var(--font-body); font-size: 13px; color: var(--text);
  }
  .field input::placeholder, .field textarea::placeholder{ color: var(--text-dim); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }

  .upload-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 10px; }
  .upload-box{
    border: 1px dashed var(--line); border-radius: 9px; padding: 14px 12px;
    background: var(--panel-alt); text-align:center; cursor:pointer;
  }
  .upload-box:hover{ border-color: var(--teal-dim); }
  .upload-box .icon{ font-size: 16px; color: var(--text-dim); margin-bottom:6px; }
  .upload-box .name{ font-size: 12px; color: var(--text); font-weight: 500; }
  .upload-box .hint{ font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }

  .chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font-family: var(--font-mono); font-size: 11.5px;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel-alt); color: var(--text-muted); cursor:pointer;
  }
  .chip.picked{ border-color: var(--teal); color: var(--teal); background: var(--panel-raised); }
  .chip.express.picked{ border-color: var(--amber); color: var(--amber); }

  .img-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top: 4px; }
  .img-slot{
    width: 56px; height: 56px; border-radius: 8px; border: 1px dashed var(--line);
    background: var(--panel-alt); display:flex; align-items:center; justify-content:center;
    font-size: 16px; color: var(--text-dim);
  }

  /* ---------- Notification feed ---------- */
  .notif-feed{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; }
  .notif{
    display:flex; gap:12px; padding: 12px 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .notif:last-child{ border-bottom:none; }
  .notif .nicon{
    width: 30px; height:30px; flex-shrink:0; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background: var(--panel-alt); border:1px solid var(--line-soft); font-size:14px;
  }
  .notif .ntext{ font-size: 13.5px; color: var(--text-muted); line-height:1.4; }
  .notif.current .ntext{ color: var(--text); font-weight: 500; }
  .notif .ntime{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-top:3px; }
  .notif.pending{ opacity: .4; }

  .kv-grid{ margin-bottom: 6px; }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:8px 2px; border-bottom:1px dashed var(--line-soft); font-size:13px; color:var(--text-muted); }
  .kv:last-child{ border-bottom:none; }
  .kv b{ color: var(--text); font-weight:500; text-align:right; }

  .approval-row{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    padding:10px 12px; background:var(--panel-alt); border:1px solid var(--line-soft); border-radius:8px; margin-bottom:8px;
    font-size:13px; color: var(--text);
  }
  .approval-row .actions{ display:flex; gap:8px; }
  .btn.sm{ padding: 6px 12px; font-size:12px; }

  .doc-chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .doc-chip{
    font-family: var(--font-mono); font-size:11.5px; padding:7px 12px; border-radius:8px;
    border:1px solid var(--line-soft); background: var(--panel-alt); color: var(--text-muted);
  }

  .flow-mini{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-family: var(--font-mono); font-size:11.5px; }
  .flow-mini .node{ padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel-alt); color: var(--text-muted); }
  .flow-mini .node.done{ color: var(--teal); border-color: var(--teal-dim); }
  .flow-mini .arrow{ color: var(--text-dim); }

  .track-list{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:2px; }
  .track-list li{
    display:flex; align-items:center; gap:10px; padding:9px 4px;
    font-size:13.5px; color: var(--text-dim); border-left: 2px solid var(--line-soft); padding-left:14px;
  }
  .track-list li .box{ font-size:14px; flex-shrink:0; }
  .track-list li.done{ color: var(--text-muted); border-left-color: var(--teal-dim); }
  .track-list li.current{ color: var(--text); font-weight:500; border-left-color: var(--amber); }

  .doc-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .doc-list li{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; background:var(--panel-alt); border:1px solid var(--line-soft); border-radius:8px;
    font-size:13px; color: var(--text);
  }
  .doc-list li.locked{ color: var(--text-dim); }
  .doc-list .dlink{ font-family: var(--font-mono); font-size:11px; color: var(--teal); }
  .doc-list li.locked .dlink{ color: var(--text-dim); }

  @media (max-width:640px){
    .tracker{ grid-template-columns: repeat(3,1fr); }
    .header{ flex-direction:column; align-items:flex-start; }
    .cat-grid{ grid-template-columns: 1fr; }
    .form-grid{ grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <p class="eyebrow">MaxVolt ReEarth · Digital Operating Platform</p>
      <h1 class="title">Process Tracker <span>— what each side sees</span></h1>
    </div>
    <div class="toggle" role="tablist" aria-label="Switch dashboard view">
      <button id="btn-client" class="active" onclick="setView('client')">Client View</button>
      <button id="btn-internal" onclick="setView('internal')">ReEarth Internal</button>
    </div>
  </div>

  <div class="tracker" id="tracker"></div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="panel-title">Step 1 — Business Partner Onboarding</h2>
      <span class="tag client" id="panel-tag">Client View</span>
    </div>
    <div id="panel-body"></div>
  </div>

  <footer>Click a cell above to move through the process · toggle switches whose screen you're looking at</footer>
</div>

<script>
const steps = [
  { label: "Onboarding" },
  { label: "Verification" },
  { label: "Procurement" },
  { label: "Operations" },
  { label: "Plant Ops" },
];

let currentStep = 0;
let currentView = 'client';

const trackerEl = document.getElementById('tracker');
steps.forEach((s, i) => {
  const cell = document.createElement('button');
  cell.className = 'cell';
  cell.setAttribute('aria-label', 'Step ' + (i+1) + ' ' + s.label);
  cell.innerHTML = `
    <div class="num">STEP ${String(i+1).padStart(2,'0')}</div>
    <div class="label">${s.label}</div>
    <div class="charge"><i></i></div>
  `;
  cell.onclick = () => { currentStep = i; render(); };
  trackerEl.appendChild(cell);
});

function setView(v){
  currentView = v;
  document.getElementById('btn-client').classList.toggle('active', v==='client');
  document.getElementById('btn-internal').classList.toggle('active', v==='internal');
  document.getElementById('panel-tag').textContent = v === 'client' ? 'Client View' : 'ReEarth Internal';
  document.getElementById('panel-tag').className = 'tag ' + (v === 'client' ? 'client' : 'internal');
  render();
}

function renderTracker(){
  const cells = trackerEl.querySelectorAll('.cell');
  cells.forEach((c,i) => {
    c.classList.toggle('done', i < currentStep);
    c.classList.toggle('active', i === currentStep);
  });
}

const titles = [
  "Step 1 — Business Partner Onboarding",
  "Step 2 — Verification (Document + Inspection)",
  "Step 3 — Procurement Review",
  "Step 4 — Operations & Logistics",
  "Step 5 — Plant Operations",
];

function renderPanel(){
  document.getElementById('panel-title').textContent = titles[currentStep];
  const body = document.getElementById('panel-body');
  body.innerHTML = views[currentView][currentStep]();
}

function render(){
  renderTracker();
  renderPanel();
}

// ---------------- CLIENT VIEW CONTENT ----------------
const client = [
  // Step 1
  () => `
    <div class="section-block">
      <div class="section-head"><span class="si">01</span><h3>Select Your Category</h3></div>
      <p class="section-sub">Choose the category that matches your business — this decides which onboarding fields you'll fill next.</p>
      <div class="cat-grid">
        <div class="cat-card picked">
          <span class="cat-tag">CAT-1 · PRODUCER</span>
          <h4>Manufacturer / OEM / Importer</h4>
          <ul>
            <li>Battery Manufacturer</li>
            <li>OEM</li>
            <li>Importer</li>
            <li>Battery Assembler</li>
          </ul>
        </div>
        <div class="cat-card">
          <span class="cat-tag">CAT-2 · COLLECTION PARTNER</span>
          <h4>Aggregators &amp; Dealers</h4>
          <ul>
            <li>Aggregator</li>
            <li>Collection Center</li>
            <li>Scrap Dealer</li>
            <li>Bulk Consumer</li>
            <li>Dealer / Distributor</li>
          </ul>
        </div>
        <div class="cat-card">
          <span class="cat-tag">CAT-3 · WASTE GENERATOR</span>
          <h4>Corporates &amp; Institutions</h4>
          <ul>
            <li>EV Fleet / Telecom</li>
            <li>Data Centre</li>
            <li>Solar &amp; BESS Operator</li>
            <li>Govt / PSU, Hospitals</li>
            <li>Educational Institution</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="section-head"><span class="si">02</span><h3>Company Profile</h3></div>
      <div class="form-grid">
        <div class="field"><label>CIN</label><input placeholder="U31909DL2020PTC123456"></div>
        <div class="field"><label>GST Number</label><input placeholder="07ABCDE1234F1Z5"></div>
        <div class="field"><label>PAN</label><input placeholder="ABCDE1234F"></div>
        <div class="field"><label>Contact Person</label><input placeholder="Full name"></div>

        <tr><td class="strong">BATCH-044</td><td><span class="pill ok">Done</span></td><td><span class="pill ok">Done</span></td><td><span class="pill ok">Done</span></td><td>42%</td><td>91%</td><td><span class="pill ok">Passed</span></td></tr>

];

const views = { client, internal };

// Delegated interactivity for injected form elements (category pick, priority chip)
document.getElementById('panel-body').addEventListener('click', (e) => {
  const cat = e.target.closest('.cat-card');
  if (cat){
    cat.parentElement.querySelectorAll('.cat-card').forEach(c => c.classList.remove('picked'));
    cat.classList.add('picked');
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip){
    chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
    chip.classList.add('picked');
  }
});

render();
</script>
